<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ATP Top 100 Stats</title>
  <!-- Favicon: yellow tennis ball -->
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>ATP Top 100 Stats</h1>
    <p class="subtitle">Men's singles &middot; <span id="updated"></span></p>
  </header>

  <!-- Tab buttons: data-tab must match the id of a <section> below -->
  <nav class="tabs">
    <button data-tab="top100" class="active">Top 100</button>
    <button data-tab="lefties">Left-handers</button>
    <button data-tab="onehanders">One-handed backhand</button>
    <button data-tab="countries">By country</button>
    <button data-tab="height">Average height</button>
    <button data-tab="slams">Grand Slam winners</button>
    <button data-tab="masters">Masters 1000</button>
  </nav>

  <main>
    <section id="top100" class="panel active"></section>
    <section id="lefties" class="panel"></section>
    <section id="onehanders" class="panel"></section>
    <section id="countries" class="panel"></section>
    <section id="height" class="panel"></section>
    <section id="slams" class="panel"></section>
    <section id="masters" class="panel"></section>
  </main>

  <footer>
    Rankings update automatically (<code>players.js</code>); player details are in <code>player-details.json</code>. <br>
    Sources: rankings from <a href="https://www.tennisabstract.com/" target="_blank" rel="noopener">Tennis Abstract</a>; player details and titles from <a href="https://en.wikipedia.org/" target="_blank" rel="noopener">Wikipedia</a>, used under the <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener">CC BY-SA 4.0</a> license. Non-commercial hobby project.
  </footer>

  <script src="players.js"></script>
  <script src="grand-slams.js"></script>
  <script src="masters.js"></script>
  <script src="app.js"></script>
</body>
</html>
